# Insert inside the existing http{} context, in addition to existing logging.
log_format attackscope escape=json
  '{"timestamp":"$time_iso8601","remote_addr":"$remote_addr",'
  '"hostname":"$hostname","request_method":"$request_method",'
  '"path":"$uri","status":$status,"dst_port":$server_port,'
  '"duration_seconds":$request_time,"user_agent":"$http_user_agent",'
  '"request_id":"$request_id"}';
access_log /var/log/attackscope/access.json attackscope buffer=32k flush=1s;
