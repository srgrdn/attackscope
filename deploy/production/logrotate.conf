/srv/attackscope/production/logs/nginx/access.json {
    daily
    maxsize 20M
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    create 0644 root root
    su root root
    sharedscripts
    postrotate
        /usr/bin/docker exec example-nginx-1 nginx -s reopen
    endscript
}
