data_dir: /var/lib/vector
sources:
  nginx:
    type: file
    include: [/var/log/nginx/attackscope.json]
    max_line_bytes: 16384
    read_from: end
transforms:
  envelope:
    type: remap
    inputs: [nginx]
    drop_on_error: true
    source: |
      p = parse_json!(string!(.message))
      path = split(string!(p.path), "?")[0]
      . = {"transport_version": 1, "source": "http", "source_reference": p.request_id,
           "payload": {"timestamp": p.timestamp, "remote_addr": p.remote_addr,
           "hostname": p.hostname, "request_method": p.request_method, "path": path,
           "status": to_int!(p.status), "dst_port": to_int!(p.dst_port),
           "duration_ms": to_float!(p.duration_seconds) * 1000.0, "user_agent": p.user_agent}}
sinks:
  attackscope:
    type: http
    inputs: [envelope]
    uri: ${ATTACKSCOPE_INGEST_URL}
    method: post
    auth:
      strategy: bearer
      token: ${ATTACKSCOPE_SOURCE_TOKEN}
    encoding:
      codec: json
    framing:
      method: character_delimited
      character_delimited:
        delimiter: ','
    batch:
      max_events: 100
      max_bytes: 262144
      timeout_secs: 1
    buffer:
      type: memory
      max_events: 1000
      when_full: block
    request:
      concurrency: 1
      rate_limit_num: 3
      rate_limit_duration_secs: 1
    tls:
      verify_certificate: true
      verify_hostname: true
    healthcheck:
      enabled: false
