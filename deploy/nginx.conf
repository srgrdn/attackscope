worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Docker can assign another IP after a backend crash/restart. Re-resolve it.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream attackscope_read {
        zone attackscope_read 64k;
        server backend:8000 resolve;
    }
    map $http_host $local_host {
        default 0;
        ~^localhost(:[0-9]+)?$ 1;
        ~^127\.0\.0\.1(:[0-9]+)?$ 1;
        ~^\[::1\](:[0-9]+)?$ 1;
    }
    server {
        include /etc/nginx/attackscope-listen.conf;
        root /usr/share/nginx/html;
        if ($local_host = 0) { return 421; }
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        location = /health/live {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
        location = /api/v1/health/ready {
            proxy_pass http://attackscope_read/health/ready;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_hide_header Server;
            add_header Cache-Control no-store always;
        }
        location = /api/v1/hosts {
            proxy_pass http://attackscope_read;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
        location ~ "^/api/v1/ips/[0-9a-fA-F:.%]+$" {
            proxy_pass http://attackscope_read;
            proxy_read_timeout 10s;
        }
        location ~ "^/api/v1/(history|overview|events/export[.](csv|json))$" {
            proxy_pass http://attackscope_read;
            proxy_read_timeout 10s;
        }
        location = /api/v1/findings {
            proxy_pass http://attackscope_read;
            proxy_read_timeout 10s;
        }
        location = /api/v1/timeline {
            proxy_pass http://attackscope_read;
            proxy_read_timeout 10s;
        }
        location = /api/v1/events {
            proxy_pass http://attackscope_read;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
        location ~ "^/api/v1/events/[0-9a-fA-F-]{36}$" {
            proxy_pass http://attackscope_read;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
        # No blanket proxy: ingestion is never reachable through the UI listener.
        location /api/ { return 404; }
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
